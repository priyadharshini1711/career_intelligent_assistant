server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients pinned to
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Same-origin API. Keeps CORS out of the picture entirely in the container
    # setup -- the browser only ever sees one host.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation can take a while on a slow provider or a local model.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Single-page app: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
