# Two services, one network, no database -- session state is deliberately
# in-process (see backend/app/session.py for why, and the README for what has
# to change before this scales past one replica).
#
#   cp backend/.env.example backend/.env   # add a GEMINI_API_KEY, or leave it
#   docker compose up --build              # http://localhost:8080
#
# With no API key the stack still runs end to end on the offline stub model.

services:
  backend:
    build:
      context: ./backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Structured logs in a container: something is going to ship these.
      LOG_FORMAT: json
      SAMPLES_DIR: /samples
    volumes:
      # The sample documents live outside the backend build context, so they
      # are mounted rather than copied. Read-only -- nothing should write here.
      - ./samples:/samples:ro
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/system/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - '${PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
